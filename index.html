<body>

<button class="chat-button" onclick="toggleChat()">💬</button>

<div class="chat-container" id="chat">
  <div class="chat-header">Atendimento</div>

  <div class="chat-messages" id="messages">
    <div class="message bot">Olá! Como posso te ajudar?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="input" placeholder="Digite sua mensagem..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
  function toggleChat() {
    const chat = document.getElementById("chat");
    chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  }

  function sendMessage() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    const messages = document.getElementById("messages");

    // Mensagem do usuário
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerText = text;
    messages.appendChild(userMsg);

    // Resposta fake do bot
    const botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.innerText = "Estou processando sua solicitação...";
    
    setTimeout(() => {
      botMsg.innerText = "Essa é uma resposta simulada do chatbot.";
    }, 1000);

    messages.appendChild(botMsg);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
